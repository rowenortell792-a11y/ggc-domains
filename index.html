<script>
function buyDomain(domain, price) {
  let paymentLink = "https://cash.app/$YourCashTag"; // CHANGE THIS

  let confirmPay = confirm(
    `Send $${price} to complete purchase of ${domain}.\n\nPress OK to go to payment.`
  );

  if (confirmPay) {
    window.open(paymentLink, "_blank");

    // After payment, user enters confirmation
    let code = prompt("Enter payment confirmation code:");

    if (code === "GGC2026") {
      completePurchase(domain, price);
    } else {
      alert("❌ Invalid code. Purchase not completed.");
    }
  }
}

function completePurchase(domain, price) {
  let purchases = JSON.parse(localStorage.getItem("ggcDomains")) || [];

  purchases.push({
    name: domain,
    price: price,
    date: new Date().toLocaleString()
  });

  localStorage.setItem("ggcDomains", JSON.stringify(purchases));

  alert(`🔥 ${domain} is now yours!`);

  showOwnedDomains();
}
</script>
